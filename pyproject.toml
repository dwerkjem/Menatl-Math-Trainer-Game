[project]
name = "Mental_Math_Trainer_Game"
version = "0.0.0"
dependencies = [
  "python-dotenv>=1.2.4",
]
requires-python = ">=3.13"
authors = [
  { name = "Derek R. Neilson", email = "derekrneilson@gmail.com" },
]
description = "A mental math game to help you learn"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE*"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
mmtg = "mental_math_trainer_game.__main__:main"

[project.urls]
Repository = "https://git.com"
Issues = "https://git.com/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "lefthook>=2.2.2",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
]

[tool.coverage.report]
omit = ["*/__main__.py"]

[tool.coverage.run]
source = ["Mental_Math_Trainer_Game"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "D104", "E501", "CPY001", "FIX002"] # remove FIX002 before launch

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"src/manage.py" = ["PLC0415", "TRY003", "EM101"]
