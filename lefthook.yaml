pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{md,json,yaml,toml}"
      run: dprint fmt {staged_files}
      stage_fixed: true

    - name: ruff format
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    - name: ruff lint
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}

    - name: bats
      run: bats -r tests/

    - name: pytest
      run: uv run pytest -q || [ $? -eq 5 ]
